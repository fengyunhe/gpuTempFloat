name: Release

# 打 tag（v1.2.0 这种）推送就自动打包并发布 Release；
# 也可以在 Actions 页面手动点 Run workflow，填一个 tag 名（留空则生成 nightly 预览版）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（例如 v1.2.0；留空自动生成 nightly-<日期>-<构建号>）"
        required: false
        default: ""
      prerelease:
        description: "标记为预发布"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & release (Windows x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Fetch UPX (用于压缩 DLL，缺失则体积 +20MB)
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "tools\upx"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "upx.zip"
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "upx_x") -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP "upx_x\upx-4.2.4-win64\*") $dest -Recurse -Force
          "UPX_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $dest "upx.exe") --version | Select-Object -First 1

      - name: Build single-file exe
        run: python -m PyInstaller --noconfirm --clean GpuTempFloat.spec

      - name: Resolve version & package assets
        id: pack
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "nightly-{0}-{1}" -f (Get-Date -Format "yyyyMMdd"), "${{ github.run_number }}"
          }
          $version = $tag -replace '^v', ''
          $exe = "dist\GpuTempFloat.exe"
          if (-not (Test-Path $exe)) { throw "build output missing: $exe" }
          $asset = "GpuTempFloat-$version-win64.exe"
          Copy-Item $exe $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
          $size = [math]::Round((Get-Item $asset).Length / 1MB, 2)
          "TAG=$tag"             | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version"     | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ASSET=$asset"         | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SHA256=$hash"         | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "tag=$tag"             | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version"     | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset=$asset"         | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash"         | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "tag=$tag version=$version asset=$asset size=${size}MB"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: GpuTempFloat ${{ steps.pack.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Windows x64 单文件绿色版，双击即用，无需安装 Python。

            - **下载**：`${{ steps.pack.outputs.asset }}`（精简 Qt 运行时 + UPX 压缩，约 25 MB）
            - **校验**：`sha256 = ${{ steps.pack.outputs.sha256 }}`
            - **右键菜单**可切换 中文 / English、穿透、透明度滑块、迷你单行模式
            - 全局热键：`Ctrl+Alt+G` 开关穿透、`Ctrl+Alt+H` 显隐、`Ctrl+Alt+Q` 退出
            - 独占全屏（Exclusive Fullscreen）游戏里系统不允许任何置顶窗口，请用无边框/窗口化全屏
          files: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.asset }}.sha256
